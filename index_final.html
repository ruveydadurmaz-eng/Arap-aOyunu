
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İnteraktif Arapça Öğrenme Platformu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    color:white;
    padding:28px 20px;
    text-align:center;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    opacity:.9;
}

.container{
    width:94%;
    max-width:1250px;
    margin:25px auto;
}

.levels{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:20px;
}

.level-btn{
    border:0;
    padding:15px 8px;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.level-btn.active{
    background:#2563eb;
    color:white;
}

.modes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.mode-btn{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    background:white;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.mode-btn.active{
    background:#111827;
    color:white;
}

.game-card{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    min-height:500px;
}

.question-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
}

.progress-text{
    font-weight:bold;
}

.question-title{
    text-align:center;
    font-size:23px;
    margin-bottom:25px;
}

.arabic{
    direction:rtl;
    text-align:right;
    font-size:28px;
    line-height:2;
}

.subtext{
    color:#64748b;
    font-size:16px;
    margin-top:8px;
}

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    max-width:900px;
    margin:auto;
}

.match-column{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.match-card{
    padding:18px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    background:white;
    cursor:pointer;
    font-size:20px;
    transition:.2s;
}

.match-card:hover{
    border-color:#2563eb;
    background:#eff6ff;
}

.match-card.selected{
    background:#dbeafe;
    border-color:#2563eb;
}

.match-card.correct{
    background:#dcfce7;
    border-color:#16a34a;
}

.match-card.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    max-width:850px;
    margin:auto;
}

.option{
    border:2px solid #e5e7eb;
    background:white;
    padding:18px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}

.option:hover{
    border-color:#2563eb;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}

.answer-box{
    max-width:850px;
    margin:auto;
}

.answer-box input,
.answer-box textarea,
.story-work textarea{
    width:100%;
    padding:15px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:18px;
    outline:none;
}

.answer-box textarea,
.story-work textarea{
    resize:vertical;
    min-height:130px;
}

.answer-box input:focus,
.answer-box textarea:focus,
.story-work textarea:focus{
    border-color:#2563eb;
}

.primary-btn{
    border:0;
    background:#2563eb;
    color:white;
    padding:13px 22px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-top:12px;
}

.secondary-btn{
    border:0;
    background:#e5e7eb;
    color:#111827;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

.story-box{
    max-width:1050px;
    margin:auto;
}

/* YENİ: TIKLANABİLİR HİKÂYE BAŞLIĞI */

.story-title{
    font-size:34px;
    text-align:center;
    margin-bottom:25px;
    direction:rtl;
    line-height:2;
}

.story-title .story-word{
    cursor:pointer;
    border-bottom:3px dotted #2563eb;
    transition:.2s;
}

.story-title .story-word:hover{
    background:#dbeafe;
    border-radius:6px;
}

/* UZUN HİKÂYE */

.story-text{
    background:#f8fafc;
    border-right:6px solid #2563eb;
    padding:30px;
    border-radius:14px;
    font-size:23px;
    line-height:2.25;
    direction:rtl;
    text-align:right;
    max-height:none;
}

.story-word{
    cursor:pointer;
    border-bottom:2px dotted #2563eb;
    transition:.15s;
}

.story-word:hover{
    background:#dbeafe;
    border-radius:5px;
}

.story-translation{
    margin-top:18px;
    background:#f8fafc;
    padding:22px;
    border-radius:12px;
    line-height:2;
    font-size:17px;
}

.story-work{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.work-card{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:22px;
    border-radius:15px;
}

.work-card.full{
    grid-column:1/-1;
}

.work-card h3{
    margin-bottom:10px;
}

.story-tip{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:16px;
    border-radius:12px;
    margin-top:20px;
    line-height:1.7;
}

.word-info{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:360px;
    max-width:90%;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
    z-index:100;
    text-align:center;
}

.word-info.show{
    display:block;
}

.word-info h2{
    direction:rtl;
    font-size:32px;
    margin-bottom:15px;
}

.word-info p{
    font-size:21px;
    color:#334155;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:90;
}

.overlay.show{
    display:block;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:5px;
    margin-top:15px;
}

.key{
    padding:9px 3px;
    border:0;
    border-radius:7px;
    background:#e2e8f0;
    cursor:pointer;
    font-size:16px;
}

.feedback{
    margin-top:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    min-height:25px;
}

.footer-bar{
    margin-top:20px;
    background:white;
    padding:18px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.score{
    font-size:20px;
    font-weight:bold;
}

.next-btn{
    border:0;
    background:#16a34a;
    color:white;
    padding:13px 25px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:800px){

    .levels{
        grid-template-columns:repeat(3,1fr);
    }

    .match-grid,
    .story-work{
        grid-template-columns:1fr;
    }

    .option-grid{
        grid-template-columns:1fr;
    }

    .game-card{
        padding:18px;
    }

    .story-text{
        font-size:20px;
        padding:20px;
    }

    .story-title{
        font-size:27px;
    }
}


/* ===== PROFESYONEL OYUN ARAYÜZÜ ===== */
:root{
  --indigo:#4f46e5;--violet:#7c3aed;--pink:#ec4899;--cyan:#06b6d4;
  --green:#10b981;--amber:#f59e0b;--ink:#172033;--muted:#64748b;
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 10%,rgba(251,191,36,.28),transparent 24%),
    radial-gradient(circle at 92% 14%,rgba(236,72,153,.22),transparent 26%),
    radial-gradient(circle at 80% 88%,rgba(6,182,212,.20),transparent 28%),
    linear-gradient(135deg,#eef2ff 0%,#fdf2f8 47%,#ecfeff 100%);
  background-attachment:fixed;
}
body::before,body::after{
  position:fixed;z-index:-1;opacity:.10;font-size:120px;pointer-events:none;
  animation:floatGame 7s ease-in-out infinite;
}
body::before{content:"✦";left:3%;top:34%;color:var(--violet)}
body::after{content:"★";right:4%;bottom:12%;color:var(--pink);animation-delay:1.5s}
@keyframes floatGame{50%{transform:translateY(-22px) rotate(10deg) scale(1.08)}}
header{
  background:linear-gradient(135deg,#4338ca 0%,#7c3aed 52%,#ec4899 100%);
  box-shadow:0 12px 35px rgba(79,70,229,.25);position:relative;overflow:hidden;
}
header::after{content:"🎮  ⭐  🧩  🚀  📚";position:absolute;inset:auto 0 6px;font-size:20px;letter-spacing:18px;opacity:.16}
.container{margin-top:28px}
.game-hud{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-bottom:18px}
.hud-item{background:rgba(255,255,255,.9);border:1px solid rgba(224,231,255,.95);border-radius:16px;padding:14px 16px;box-shadow:0 8px 22px rgba(79,70,229,.10);backdrop-filter:blur(8px)}
.hud-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.hud-value{font-size:21px;font-weight:900;margin-top:4px}.xp-track{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--pink),var(--violet));transition:width .35s}
.level-btn,.mode-btn{transition:.18s transform,.18s box-shadow,.18s background}.level-btn:hover,.mode-btn:hover{transform:translateY(-3px);box-shadow:0 9px 22px rgba(79,70,229,.16)}
.level-btn.active{background:linear-gradient(135deg,var(--indigo),var(--violet));color:white}.mode-btn.active{background:linear-gradient(135deg,#111827,var(--indigo));color:white}
.game-card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 55px rgba(79,70,229,.14);backdrop-filter:blur(10px)}
.question-title{font-weight:900}.badge{background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#5b21b6;border:1px solid #ddd6fe}
.primary-btn,.next-btn{background:linear-gradient(135deg,var(--indigo),var(--violet));box-shadow:0 6px 16px rgba(79,70,229,.22);transition:.15s}.primary-btn:hover,.next-btn:hover{transform:translateY(-2px)}.next-btn{background:linear-gradient(135deg,#10b981,#059669)}
.mode-panel{max-width:900px;margin:auto}.hero-word{margin:18px auto;padding:24px;border-radius:20px;background:linear-gradient(135deg,#eef2ff,#fdf2f8);border:1px solid #ddd6fe;text-align:center}.hero-word .arabic{font-size:46px;text-align:center;font-weight:900}
.puzzle-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px auto;max-width:800px}.letter-tile{min-width:54px;padding:13px 11px;border:2px solid #c7d2fe;border-radius:14px;background:linear-gradient(180deg,#fff,#eef2ff);font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 5px 13px rgba(79,70,229,.10);transition:.15s}.letter-tile:hover{transform:translateY(-4px) rotate(-2deg);border-color:var(--violet)}.letter-tile.used{opacity:.34;cursor:default;transform:scale(.94)}
.hint-box{margin:18px auto;max-width:760px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1px solid #fcd34d;text-align:center;font-size:18px}.answer-display{min-height:78px;border:2px dashed #c7d2fe;border-radius:15px;padding:18px;text-align:center;font-size:34px;direction:rtl;background:#fafafa}
.dictation-speaker{width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;font-size:46px;background:linear-gradient(135deg,#dbeafe,#ede9fe);box-shadow:0 10px 28px rgba(79,70,229,.18)}
.footer-bar{border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 28px rgba(79,70,229,.12)}
@media(max-width:800px){.game-hud{grid-template-columns:1fr}.hero-word .arabic{font-size:38px}.letter-tile{min-width:44px}.mode-btn{flex:1 1 45%}}

</style>
</head>

<body>

<header>
    <h1>📚 İnteraktif Arapça Öğrenme Platformu</h1>
    <p>Kelime öğren • Cümle kur • Dinle • Yaz • Hikâye oku • Kendi hikâyeni oluştur</p>
</header>

<div class="container">


    <div class="game-hud">
        <div class="hud-item"><div class="hud-label">🏆 Toplam XP</div><div class="hud-value" id="xpValue">0 XP</div><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div></div>
        <div class="hud-item"><div class="hud-label">🔥 Doğru Seri</div><div class="hud-value">🔥 <span id="streakValue">0</span></div></div>
        <div class="hud-item"><div class="hud-label">🎖️ Rütbe</div><div class="hud-value" id="rankValue">Yeni Başlangıç</div></div>
    </div>

    <div class="levels">
        <button class="level-btn active" onclick="manualLevelSelect(1)">A1<br><small>Başlangıç</small></button>
        <button class="level-btn" onclick="manualLevelSelect(2)">A2<br><small>Temel</small></button>
        <button class="level-btn" onclick="manualLevelSelect(3)">B1<br><small>Orta</small></button>
        <button class="level-btn" onclick="manualLevelSelect(4)">B2<br><small>Orta Üstü</small></button>
        <button class="level-btn" onclick="manualLevelSelect(5)">C1<br><small>İleri</small></button>
        <button class="level-btn" onclick="manualLevelSelect(6)">C2<br><small>Ustalık</small></button>
    </div>

    <div class="modes">
        <button class="mode-btn active" onclick="switchMode('matching',this)">🔗 Eşleştirme</button>
        <button class="mode-btn" onclick="switchMode('puzzle',this)">🧩 Kelime Bulmaca</button>
        <button class="mode-btn" onclick="switchMode('completion',this)">✏️ Boşluk Doldurma</button>
        <button class="mode-btn" onclick="switchMode('sentence',this)">🧱 Cümle Yapbozu</button>
        <button class="mode-btn" onclick="switchMode('dictation',this)">🎧 Dikte</button>
        <button class="mode-btn" onclick="switchMode('letters',this)">🔤 Harfleri Diz</button>
        <button class="mode-btn" onclick="switchMode('hint',this)">🧠 İpucundan Bul</button>
        <button class="mode-btn" onclick="switchMode('story',this)">📖 Hikâye</button>
    </div>

    <div class="game-card">

        <div class="question-top">
            <span class="badge" id="levelBadge">A1</span>
            <span class="progress-text" id="progressText">1 / 10</span>
        </div>

        <div id="gameArea"></div>

        <div class="feedback" id="feedback"></div>

    </div>

    <div class="footer-bar">
        <div class="score">
            ⭐ Puan: <span id="score">0</span>
        </div>

        <button class="next-btn" onclick="nextQuestion()">
            Sonraki ➜
        </button>
    </div>

</div>

<div class="overlay" id="overlay" onclick="closeWordInfo()"></div>

<div class="word-info" id="wordInfo">

    <h2 id="infoArabic"></h2>

    <p id="infoTurkish"></p>

    <button class="primary-btn" onclick="closeWordInfo()">
        Kapat
    </button>

</div>

let currentLevel=1;

/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function shuffle(array){

    const arr=[...array];

    for(let i=arr.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];
    }

    return arr;
}


function normalizeArabic(text){

    return text
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/[إأآا]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   SORULARI HAZIRLA
========================================================= */

function prepareQuestions(){
    const pool=wordPool[currentLevel] || [];
    const levelKey=String(currentLevel);
    const used=new Set(usedWordsByLevel[levelKey] || []);
    let fresh=pool.filter(x=>!used.has(normalizeArabic(x[0])));
    if(fresh.length<Math.min(20,pool.length)){
        used.clear();
        usedWordsByLevel[levelKey]=[];
        fresh=[...pool];
    }
    const words=shuffle(fresh.length?fresh:pool);
    const selected=words.slice(0,Math.min(40,words.length));
    selected.forEach(x=>used.add(normalizeArabic(x[0])));
    usedWordsByLevel[levelKey]=[...used];
    saveGameProgress();

    const matching=[];
    for(let i=0;i+3<selected.length;i+=4){
        matching.push({items:selected.slice(i,i+4).map(x=>({ar:x[0],tr:x[1]}))});
    }
    if(!matching.length && selected.length){
        matching.push({items:selected.slice(0,Math.min(4,selected.length)).map(x=>({ar:x[0],tr:x[1]}))});
    }

    modeQuestions={
        matching,
        puzzle:selected.map(x=>({ar:x[0],tr:x[1]})),
        completion:selected.map(x=>({ar:x[0],tr:x[1]})),
        sentence:shuffle(sentencePool[currentLevel]||[]),
        dictation:shuffle(sentencePool[currentLevel]||[]),
        letters:selected.map(x=>({ar:x[0],tr:x[1]})),
        hint:selected.map(x=>({ar:x[0],tr:x[1]})),
        story:shuffle(storyPool[currentLevel]||[])
    };

    currentQuestion=0;
    answered=false;
    selectedLeft=null;
    selectedRight=null;
    updateUI();
    loadQuestion();
}

function saveGameProgress(){
    localStorage.setItem("arabicGameProgress",JSON.stringify({xp,streak,usedWordsByLevel}));
}

function reward(points,message){
    score+=points; xp+=points; streak+=1; saveGameProgress();
    if(message)document.getElementById("feedback").textContent=message;
    updateUI();
}

function fail(message){
    streak=0; saveGameProgress();
    if(message)document.getElementById("feedback").textContent=message;
    updateUI();
}

/* =========================================================
   ARAYÜZ
========================================================= */

function updateUI(){
    document.getElementById("levelBadge").textContent=levelNames[currentLevel];
    const total=modeQuestions[currentMode] ? modeQuestions[currentMode].length : 1;
    document.getElementById("progressText").textContent=`${Math.min(currentQuestion+1,Math.max(total,1))} / ${Math.max(total,1)}`;
    document.getElementById("score").textContent=score;
    const xpEl=document.getElementById("xpValue"); if(xpEl)xpEl.textContent=`${xp} XP`;
    const streakEl=document.getElementById("streakValue"); if(streakEl)streakEl.textContent=streak;
    const rank=xp>=800?"Arapça Ustası":xp>=400?"Kelime Avcısı":xp>=180?"Cümle Kurucu":xp>=60?"Yükselen Öğrenci":"Yeni Başlangıç";
    const rankEl=document.getElementById("rankValue"); if(rankEl)rankEl.textContent=rank;
    const fill=document.getElementById("xpFill"); if(fill)fill.style.width=`${Math.min(100,xp%100)}%`;
}


function manualLevelSelect(level){

    currentLevel=level;

    document.querySelectorAll(".level-btn").forEach((btn,index)=>{
        btn.classList.toggle("active",index+1===level);
    });

    prepareQuestions();
}


function switchMode(mode,button){

    currentMode=mode;
    currentQuestion=0;

    document.querySelectorAll(".mode-btn")
        .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    prepareQuestions();
}


/* =========================================================
   SORU YÜKLE
========================================================= */

function loadQuestion(){
    const area=document.getElementById("gameArea");
    area.innerHTML="";
    document.getElementById("feedback").textContent="";
    answered=false;
    updateUI();
    const questions=modeQuestions[currentMode];
    if(!questions || !questions.length){area.innerHTML='<div class="question-title">Bu seviyede soru bulunmuyor.</div>';return;}
    const q=questions[currentQuestion];
    if(currentMode==="matching")renderMatching(q);
    else if(currentMode==="puzzle")renderPuzzle(q);
    else if(currentMode==="completion")renderCompletion(q);
    else if(currentMode==="sentence")renderSentence(q);
    else if(currentMode==="dictation")renderDictation(q);
    else if(currentMode==="letters")renderLetters(q);
    else if(currentMode==="hint")renderHint(q);
    else if(currentMode==="story")renderStory(q);
}

/* =========================================================
   YENİ OYUN MODLARI
========================================================= */
function renderPuzzle(q){
    const choices=shuffle([q,...shuffle(wordPool[currentLevel].filter(x=>x[0]!==q.ar)).slice(0,3).map(x=>({ar:x[0],tr:x[1]}))]);
    document.getElementById("gameArea").innerHTML=`<div class="mode-panel"><div class="question-title">🧩 Türkçe ipucuna uyan Arapça kelimeyi bul.</div><div class="hint-box"><strong>İpucu:</strong> ${q.tr}</div><div class="option-grid">${choices.map(o=>`<button class="option arabic" onclick='checkWordChoice(${JSON.stringify(o.ar)},${JSON.stringify(q.ar)},this)'>${o.ar}</button>`).join("")}</div></div>`;
}
function checkWordChoice(choice,correct,btn){if(answered)return;if(normalizeArabic(choice)===normalizeArabic(correct)){btn.classList.add("correct");answered=true;reward(12,"🎉 Doğru! +12 XP");}else{btn.classList.add("wrong");fail("❌ Tekrar dene.");setTimeout(()=>btn.classList.remove("wrong"),500)}}

function renderCompletion(q){
    const opts=shuffle([q.tr,...shuffle(wordPool[currentLevel].filter(x=>x[1]!==q.tr)).slice(0,3).map(x=>x[1])]);
    document.getElementById("gameArea").innerHTML=`<div class="mode-panel"><div class="question-title">✏️ Arapça kelimenin Türkçe anlamını seç.</div><div class="hero-word"><div class="arabic">${q.ar}</div></div><div class="option-grid">${opts.map(o=>`<button class="option" onclick='checkCompletion(${JSON.stringify(o)},${JSON.stringify(q.tr)},this)'>${o}</button>`).join("")}</div></div>`;
}
function checkCompletion(choice,correct,btn){if(answered)return;if(choice===correct){btn.classList.add("correct");answered=true;reward(10,"✅ Doğru! +10 XP");}else{btn.classList.add("wrong");fail("❌ Yanlış cevap.");setTimeout(()=>btn.classList.remove("wrong"),500)}}

function renderDictation(q){
    window.currentDictation=q[0];
    document.getElementById("gameArea").innerHTML=`<div class="mode-panel" style="text-align:center"><div class="question-title">🎧 Cümleyi dinle ve Arapça olarak yaz.</div><button class="dictation-speaker" onclick="speakDictation()">🔊</button><div class="subtext">Anlamı: ${q[1]}</div><div class="answer-box" style="margin-top:22px"><input id="dictationInput" dir="rtl" class="arabic" placeholder="Duyduğun cümleyi yaz..."><button class="primary-btn" onclick='checkDictation(${JSON.stringify(q[0])})'>Kontrol Et</button></div></div>`;
}
function speakDictation(){if(!('speechSynthesis' in window)){fail("Tarayıcın sesli okumayı desteklemiyor.");return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(window.currentDictation||"");u.lang="ar-SA";u.rate=.75;speechSynthesis.speak(u)}
function checkDictation(correct){if(answered)return;const input=document.getElementById("dictationInput").value;if(normalizeArabic(input)===normalizeArabic(correct)){answered=true;reward(18,"🎧 Harika dikte! +18 XP");}else fail("❌ Henüz doğru değil. Tekrar dinleyebilirsin.")}

function renderLetters(q){

function checkLetters(correct){if(answered)return;const user=window.letterAnswer.map(x=>x.l).join("");if(user===correct){answered=true;reward(15,"🔤 Harika! Kelimeyi doğru oluşturdun. +15 XP");}else fail("❌ Harf sırası doğru değil.")}

function renderMatching(q){

    selectedLeft=null;
    selectedRight=null;

    const area=document.getElementById("gameArea");

    const shuffledRight=shuffle(q.items);

    area.innerHTML=`
        <div class="question-title">
            Arapça kelimeleri Türkçe anlamlarıyla eşleştir.
        </div>

        <div class="match-grid">

            <div class="match-column" id="leftMatches">

                ${q.items.map((item,index)=>`

                    <button
                        class="match-card arabic"
                        data-index="${index}"
                        onclick="selectLeftMatch(${index})">

                        ${item.ar}

                    </button>

                `).join("")}

            </div>

            <div class="match-column" id="rightMatches">

                ${shuffledRight.map(item=>{

                    const originalIndex=q.items.findIndex(
                        x=>x.tr===item.tr
                    );

                    return `
                        <button
                            class="match-card"
                            data-index="${originalIndex}"
                            onclick="selectRightMatch(${originalIndex})">

                            ${item.tr}

                        </button>
                    `;

                }).join("")}

            </div>

        </div>
    `;
}


function selectLeftMatch(index){

    if(answered)return;

    selectedLeft=index;

    document.querySelectorAll("#leftMatches .match-card")
        .forEach(card=>card.classList.remove("selected"));

    document
        .querySelector(`#leftMatches .match-card[data-index="${index}"]`)
        .classList.add("selected");

    checkMatchingPair();
}


function selectRightMatch(index){

    if(answered)return;

    selectedRight=index;

    document.querySelectorAll("#rightMatches .match-card")
        .forEach(card=>card.classList.remove("selected"));

    document
        .querySelector(`#rightMatches .match-card[data-index="${index}"]`)
        .classList.add("selected");

    checkMatchingPair();
}


function checkMatchingPair(){

    if(selectedLeft===null || selectedRight===null)return;

    const left=document.querySelector(
        `#leftMatches .match-card[data-index="${selectedLeft}"]`
    );

    const right=document.querySelector(
        `#rightMatches .match-card[data-index="${selectedRight}"]`
    );

    if(selectedLeft===selectedRight){

        left.classList.remove("selected");
        right.classList.remove("selected");

        left.classList.add("correct");
        right.classList.add("correct");

        reward(10,"✅ Doğru eşleştirme! +10 XP");

        selectedLeft=null;
        selectedRight=null;

        const remaining=document.querySelectorAll(
            "#leftMatches .match-card:not(.correct)"
        );

        if(remaining.length===0){

            answered=true;

            document.getElementById("feedback").textContent=
                "🎉 Harika! Tüm kelimeleri eşleştirdin.";
        }

    }else{

        left.classList.add("wrong");
        right.classList.add("wrong");

        fail("❌ Yanlış eşleştirme.");

        setTimeout(()=>{

            left.classList.remove("wrong","selected");
            right.classList.remove("wrong","selected");

        },600);

        selectedLeft=null;
        selectedRight=null;
    }

    updateUI();
}

   HEM BAŞLIK HEM HİKÂYE KELİMELERİ TIKLANABİLİR

function clickableArabicText(text){

    return text
        .trim()
        .split(/\s+/)
        .map(word=>{

            const clean=word
                .replace(/[.,!?،؛:()«»"']/g,"");

            if(!clean)return word;

            return `
                <span
                    class="story-word"
                    onclick="showWordInfo('${clean.replace(/'/g,"\\'")}')">

                    ${word}

                </span>
            `;

        })
        .join(" ");
}

/* =========================================================
   HİKÂYE SON CÜMLESİ
========================================================= */

function getStoryEnding(story){

    const sentences=story.text
        .split(/[.!؟]/)
        .map(x=>x.trim())
        .filter(Boolean);

    if(!sentences.length)return story.text;

    return sentences[sentences.length-1];
}


/* =========================================================
   HİKÂYE KAYDETME
========================================================= */

function storyStorageKey(){

    return `arabicStory_${currentLevel}_${currentQuestion}`;
}


function saveStoryWork(){

    const notes=document.getElementById("storyNotes");
    const summary=document.getElementById("storySummary");
    const continuation=document.getElementById("storyContinuation");

    const data={
        notes:notes ? notes.value : "",
        summary:summary ? summary.value : "",
        continuation:continuation ? continuation.value : ""
    };

    localStorage.setItem(
        storyStorageKey(),
        JSON.stringify(data)
    );

    updateStoryCounters();
}


function loadStoryWork(){

    const saved=
        localStorage.getItem(storyStorageKey());

    if(!saved)return;

    try{

        const data=JSON.parse(saved);

        const notes=document.getElementById("storyNotes");
        const summary=document.getElementById("storySummary");
        const continuation=document.getElementById("storyContinuation");

        if(notes)notes.value=data.notes || "";
        if(summary)summary.value=data.summary || "";
        if(continuation)continuation.value=data.continuation || "";

        updateStoryCounters();

    }catch(e){

        console.log("Hikâye kaydı okunamadı.");

    }
}


function updateStoryCounters(){

    const summary=
        document.getElementById("storySummary");

    const continuation=
        document.getElementById("storyContinuation");


    if(summary){

        const count=summary.value
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

        document.getElementById("summaryCount").textContent=
            `${count} kelime`;
    }


    if(continuation){

        const count=continuation.value
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

        document.getElementById("continuationCount").textContent=
            `${count} kelime`;
    }
}


function clearNotes(){

    const notes=
        document.getElementById("storyNotes");

    if(notes)notes.value="";

    saveStoryWork();
}


function clearContinuation(){

    const continuation=
        document.getElementById("storyContinuation");

    if(continuation)continuation.value="";

    saveStoryWork();
}


function saveContinuation(){

    const continuation=
        document.getElementById("storyContinuation");

    if(!continuation || !continuation.value.trim()){

        document.getElementById("feedback").textContent=
            "⚠️ Önce hikâyenin devamını yazmalısın.";

        return;
    }

    saveStoryWork();

    score+=5;

    document.getElementById("feedback").textContent=
        "💾 Hikâyeye devam yazın kaydedildi! +5 puan";

    updateUI();
}


function checkSummary(){

    const summary=
        document.getElementById("storySummary");

    if(!summary || !summary.value.trim()){

        document.getElementById("feedback").textContent=
            "⚠️ Önce hikâyenin özetini yazmalısın.";

        return;
    }

    const wordCount=
        summary.value
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;


    if(wordCount<10){

        document.getElementById("feedback").textContent=
            "📝 Özet biraz kısa. En az 10 kelimeyle anlatmayı dene.";

        return;
    }

    score+=10;

    document.getElementById("feedback").textContent=
        "🎉 Özet tamamlandı! +10 puan";

    saveStoryWork();

    updateUI();
}


/* =========================================================
   KELİME SÖZLÜĞÜ
========================================================= */

function showWordInfo(word){

    document.getElementById("infoArabic").textContent=word;

    const found=findWordTranslation(word);

    document.getElementById("infoTurkish").textContent=
        found || "Bu kelime için Türkçe anlam bulunamadı.";

    document.getElementById("wordInfo")
        .classList.add("show");

    document.getElementById("overlay")
        .classList.add("show");
}


function findWordTranslation(word){

    const normalized=normalizeArabic(word);

    for(const level of Object.keys(wordPool)){

        for(const item of wordPool[level]){

            if(normalizeArabic(item[0])===normalized){

                return item[1];
            }
        }
    }

    const dictionary={

        "في":"içinde / -de / -da",
        "إلى":"-e / -a",
        "من":"-den / -dan",
        "مع":"ile",
        "على":"üzerinde / üzerine",
        "كان":"idi",
        "كانت":"idi",
        "هذا":"bu",
        "هذه":"bu",
        "الذي":"ki / olan",
        "التي":"ki / olan",
        "ثم":"sonra",
        "بعد":"sonra",
        "قبل":"önce",
        "لكن":"fakat / ama",
        "لأن":"çünkü",
        "لذلك":"bu nedenle",
        "أصبح":"oldu",
        "أراد":"istedi",
        "قرر":"karar verdi",
        "بدأ":"başladı",
        "رأى":"gördü",
        "ذهب":"gitti",
        "جاء":"geldi",
        "دخل":"girdi",
        "خرج":"çıktı",
        "جلس":"oturdu",
        "قرأ":"okudu",
        "كتب":"yazdı",
        "فكر":"düşündü",
        "وجد":"buldu",
        "عمل":"çalıştı",
        "ساعد":"yardım etti",
        "تعلم":"öğrendi",
        "نجح":"başardı",
        "قال":"dedi",
        "عرف":"bildi",
        "فهم":"anladı",
        "كل":"her / bütün",
        "يوم":"gün",
        "اليوم":"bugün",
        "غدا":"yarın",
        "أمس":"dün"
    };

    return dictionary[normalized];
}


function closeWordInfo(){

    document.getElementById("wordInfo")
        .classList.remove("show");

    document.getElementById("overlay")
        .classList.remove("show");
}

   SONRAKİ
========================================================= */

function nextQuestion(){

    const questions=modeQuestions[currentMode];

    if(!questions)return;

    if(currentQuestion<questions.length-1){

        currentQuestion++;

        loadQuestion();

    }else{

        onLevelComplete();
    }
}


function onLevelComplete(){
