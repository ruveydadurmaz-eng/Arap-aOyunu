<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktif Arapça Öğrenme Platformu</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --selected: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .level-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f5;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .badge {
            background-color: var(--primary);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 10px 16px;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .mode-btn.active {
            background-color: var(--accent);
            color: white;
        }

        .game-area {
            min-height: 320px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .audio-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .audio-btn.slow {
            background: #e67e22;
        }

        .virtual-keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 15px;
            width: 100%;
            max-width: 650px;
            direction: rtl;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .key-btn {
            padding: 10px;
            min-width: 36px;
            font-size: 1.2rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 2px 0 #ccc;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .key-btn.wide {
            min-width: 70px;
            font-size: 0.9rem;
            background-color: #e9ecef;
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            padding: 12px;
            background: #f8f9fa;
            border: 2px solid #ced4da;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 1.3rem;
            transition: 0.2s;
            direction: rtl;
        }

        .match-card.turkish {
            direction: ltr;
            font-size: 1.1rem;
        }

        .match-card.selected {
            border-color: var(--selected);
            background-color: #fef9e7;
        }

        .match-card.matched {
            visibility: hidden;
        }

        .arabic-text {
            font-size: 1.8rem;
            direction: rtl;
            margin: 15px 0;
            color: var(--primary);
            line-height: 2.2;
            text-align: justify;
        }

        /* Tıklanabilir Kelime / Sözlük Özelliği */
        .clickable-word {
            position: relative;
            display: inline-block;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        .clickable-word:hover {
            background-color: #e8f5e9;
            color: #27ae60;
        }

        .word-popup {
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2c3e50;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100;
            pointer-events: none;
            direction: ltr;
            display: none;
        }

        .word-popup::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }

        .clickable-word.active-word {
            background-color: #fff3cd;
            color: #856404;
        }

        .clickable-word.active-word .word-popup {
            display: block;
        }

        .story-container {
            width: 100%;
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .story-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            direction: rtl;
            line-height: 2;
        }

        .story-translation {
            font-size: 0.95rem;
            color: #666;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
            line-height: 1.5;
        }

        .story-hint-text {
            font-size: 0.85rem;
            color: #27ae60;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-box {
            width: 100%;
            margin-top: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .question-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .option-btn, .word-btn {
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .sentence-box {
            min-height: 50px;
            width: 100%;
            border: 2px solid #27ae60;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            padding: 10px;
            justify-content: center;
            direction: rtl;
            flex-wrap: wrap;
        }

        .words-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            direction: rtl;
        }

        .dictation-input {
            width: 80%;
            padding: 12px;
            font-size: 1.3rem;
            direction: rtl;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin: 15px 0;
        }

        .footer-controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .match-instruction {
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>İnteraktif Arapça Öğrenme Platformu</h2>
    </header>

    <div class="level-control">
        <div>
            <label for="levelSelect"><strong>Zorluk Seviyesi:</strong></label>
            <select id="levelSelect" onchange="manualLevelSelect(this.value)">
                <option value="1">1. Seviye - Başlangıç (A1)</option>
                <option value="2">2. Seviye - Temel (A2)</option>
                <option value="3">3. Seviye - Orta Altı (B1)</option>
                <option value="4">4. Seviye - Orta (B2)</option>
                <option value="5">5. Seviye - İleri Altı (C1)</option>
                <option value="6">6. Seviye - İleri (C2)</option>
            </select>
        </div>
        <span id="levelStatus" class="badge">Aktif: 1. Seviye</span>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="switchMode('matching', event)">Çoklu Eşleştirme</button>
        <button class="mode-btn" onclick="switchMode('completion', event)">Cümle Tamamlama</button>
        <button class="mode-btn" onclick="switchMode('sentence', event)">Cümle Kurma</button>
        <button class="mode-btn" onclick="switchMode('dictation', event)">Sesli Dikte</button>
        <button class="mode-btn" onclick="switchMode('story', event)">Okuma & Metin (Hikaye)</button>
    </div>

    <div class="game-area" id="gameArea"></div>

    <div class="footer-controls">
        <div id="scoreDisplay">Puan: 0</div>
        <div id="progressDisplay">Alıştırma: 1 / 30</div>
        <button class="action-btn" onclick="nextQuestion()">Sonraki</button>
    </div>
</div>

<script>
    const arabicKeyboardLayout = [
        ["ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"],
        ["ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"],
        ["ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ"]

    // Eş ve Zıt Anlamlı Veri Havuzu
    const wordPool = {

        ]

    // Uzun Hikaye / Metin Veri Havuzu ve Metin İçi Kelime Sözlükleri
    const storyPool = {
        1: [
            {
                title: "يَوْمٌ جَمِيلٌ فِي الْحَدِيقَةِ",
                text: "فِي صَبَاحِ يَوْمِ الأَحَدِ، أَسْتَيْقِظُ مُبَكِّرًا وَأَشْرَبُ الْحَلِيبَ. الطَّقْسُ جَمِيلٌ وَالشَّمْسُ مُشْرِقَةٌ. أَذْهَبُ مَعَ عَائِلَتِي إِلَى حَدِيقَةِ الْمَدِينَةِ. الْحَدِيقَةُ كَبِيرَةٌ وَفِيهَا أَشْجَارٌ خَضْرَاءُ وَأَزْهَارٌ مُلَوَّنَةٌ. يَلْعَبُ أَخِي الصَّغِيرُ بِالْكُرَةِ، وَأَنَا أَقْرَأُ كِتَابًا جَدِيدًا تَحْتَ الشَّجَرَةِ. نَأْكُلُ الطَّعَامَ اللَّذِيذَ وَنَشْرَبُ الشَّايَ. نَحْنُ سُعَدَاءُ جِدًّا بِهَذَا الْيَوْمِ.",

                    "وَفِيهَا": "ve orada vardır", "أَشْجَارٌ": "ağaçlar", "خَضْرَاءُ": "yeşil", "وَأَزْهَارٌ": "ve çiçekler",
                    "مُلَوَّنَةٌ": "renkli", "يَلْعَبُ": "oynar", "أَخِي": "kardeşim", "الصَّغِيرُ": "küçük",
                    "بِالْكُرَةِ": "topla", "وَأَنَا": "ve ben", "أَقْرَأُ": "okuyorum", "كِتَابًا": "bir kitap",
                    "جَدِيدًا": "yeni", "تَحْتَ": "altında", "الشَّجَرَةِ": "ağacın", "نَأْكُلُ": "yeriz",
                    "الطَّعَامَ": "yemeği", "اللَّذِيذَ": "lezzetli", "وَنَشْرَبُ": "ve içeriz", "الشَّايَ": "çay",
                    "نَحْنُ": "biz", "سُعَدَاءُ": "mutluyuz", "جِدًّا": "çok", "بِهَذَا": "bu", "الْيَوْمِ": "günden"
                },
                question: "مَاذَا يَفْعَلُ الأَخُ الصَّغِيرُ فِي الْحَدِيقَةِ؟ (Küçük kardeş parkta ne yapıyor?)",

                    "فِي": "de/da", "الْأُسْبُوعِ": "haftada", "الْمَاضِي،": "geçen", "زُرْتُ": "ziyaret ettim",

    const gameData = {};

    for (let lvl = 1; lvl <= 6; lvl++) {
        const pool = wordPool[lvl] || wordPool[1];
        const stories = storyPool[lvl] || storyPool[1];
        gameData[lvl] = { matching: [], completion: [], sentence: [], dictation: [], story: [] };

        for (let i = 0; i < 30; i++) {
            const w1 = pool[i % pool.length];
            const w2 = pool[(i + 1) % pool.length];
            const w3 = pool[(i + 2) % pool.length];
            const w4 = pool[(i + 3) % pool.length];

            let matchType = 'meaning';
            if (i % 3 === 1 && w1.syn !== '-') matchType = 'synonym';
            else if (i % 3 === 2 && w1.ant !== '-') matchType = 'antonym';

            let pairs = [];
            if (matchType === 'meaning') {
                pairs = [
                    { left: w1.ar, right: w1.tr },
                    { left: w2.ar, right: w2.tr },
                    { left: w3.ar, right: w3.tr },
                    { left: w4.ar, right: w4.tr }
                ];
            } else if (matchType === 'synonym') {
                pairs = [
                    { left: w1.ar, right: w1.syn },
                    { left: w2.ar, right: w2.syn },
                    { left: w3.ar, right: w3.syn },
                    { left: w4.ar, right: w4.syn }
                ];
            } else if (matchType === 'antonym') {
                pairs = [
                    { left: w1.ar, right: w1.ant },
                    { left: w2.ar, right: w2.ant },
                    { left: w3.ar, right: w3.ant },
                    { left: w4.ar, right: w4.ant }
                ];
            }

            gameData[lvl].matching.push({ pairs, type: matchType });

            gameData[lvl].completion.push({
                ar: `هَذَا كِتَابٌ ... ${w1.ar}`,
                options: [w1.ar, w2.ar, w3.ar],
                correct: w1.ar,
                tr: `Bu ${w1.tr} bir kitaptır.`
            });
            gameData[lvl].sentence.push({
                words: ["ذَهَبَ", "الْمُعَلِّمُ", "إِلَى", "الْمَدْرَسَةِ"],
                correct: ["ذَهَبَ", "الْمُعَلِّمُ", "إِلَى", "الْمَدْرَسَةِ"],
                tr: "Öğretmen okula gitti."
            });
            gameData[lvl].dictation.push({
                ar: `${w1.ar} جَمِيلٌ`,
                tr: `${w1.tr} güzeldir.`
            });

            // Hikaye Modu Verileri
            const st = stories[i % stories.length];
            gameData[lvl].story.push(st);
        }
    }

    let currentLevel = 1;
    const maxLevel = 6;
    let currentQuestionIndex = 0;
    let currentMode = 'matching';
    let score = 0;
    let selectedLeftCard = null;
    let selectedRightCard = null;
    let matchedCount = 0;
    let builtSentence = [];
    let wrongAttempts = 0;

    window.onload = () => loadQuestion();

    function manualLevelSelect(val) {
        currentLevel = parseInt(val);
        currentQuestionIndex = 0;
        wrongAttempts = 0;
        updateUI();
        loadQuestion();
    }

    function switchMode(mode, evt) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if (evt && evt.target) {
            evt.target.classList.add('active');
        }
        currentQuestionIndex = 0;
        wrongAttempts = 0;
        loadQuestion();
    }

    function updateUI() {
        document.getElementById("levelSelect").value = currentLevel;
        document.getElementById("levelStatus").innerText = `Aktif: ${currentLevel}. Seviye`;
        document.getElementById("progressDisplay").innerText = `Alıştırma: ${currentQuestionIndex + 1} / 30`;
    }

    function loadQuestion() {
        updateUI();
        wrongAttempts = 0; 
        loadQuestionStateOnly();
    }

    function loadQuestionStateOnly() {
        const gameArea = document.getElementById("gameArea");
        const modeQuestions = gameData[currentLevel][currentMode];
        const q = modeQuestions[currentQuestionIndex];
        gameArea.innerHTML = "";

        if (currentMode === 'matching') {
            selectedLeftCard = null;
            selectedRightCard = null;
            matchedCount = 0;

            const instruction = document.createElement("div");
            instruction.className = "match-instruction";
            if (q.type === 'meaning') instruction.innerText = "Kelime ile Türkçe Anlamını Eşleştirin:";
            else if (q.type === 'synonym') instruction.innerText = "Eş Anlamlı (المترادفات) Kelimeleri Eşleştirin:";
            else if (q.type === 'antonym') instruction.innerText = "Zıt Anlamlı (الأضداد) Kelimeleri Eşleştirin:";
            gameArea.appendChild(instruction);

            const grid = document.createElement("div");
            grid.className = "match-grid";

            const leftCol = document.createElement("div");
            leftCol.className = "match-column";
            const rightCol = document.createElement("div");
            rightCol.className = "match-column";

            const leftItems = [...q.pairs].sort(() => Math.random() - 0.5);
            const rightItems = [...q.pairs].sort(() => Math.random() - 0.5);

            leftItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "match-card";
                card.innerText = item.left;
                card.onclick = () => selectMatchCard(card, 'left', item);
                leftCol.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement("div");
                card.className = q.type === 'meaning' ? "match-card turkish" : "match-card";
                card.innerText = item.right;
                card.onclick = () => selectMatchCard(card, 'right', item);
                rightCol.appendChild(card);
            });

            grid.appendChild(leftCol);
            grid.appendChild(rightCol);
            gameArea.appendChild(grid);
        }
        else if (currentMode === 'completion') {
            createAudioControls(gameArea, q.ar);
            renderArabicText(gameArea, q.ar);
            renderSubText(gameArea, q.tr);
            renderOptions(gameArea, q.options, q.correct);
        }
        else if (currentMode === 'sentence') {
            builtSentence = [];
            renderSubText(gameArea, `Hedef Cümle: ${q.tr}`);

            const box = document.createElement("div");
            box.className = "sentence-box";
            gameArea.appendChild(box);

            const wordsDiv = document.createElement("div");
            wordsDiv.className = "words-container";

            const shuffledWords = [...q.words].sort(() => Math.random() - 0.5);
            shuffledWords.forEach(word => {
                const btn = document.createElement("button");
                btn.className = "word-btn";
                btn.innerText = word;
                btn.onclick = () => {
                    builtSentence.push(word);
                    box.innerText = builtSentence.join(" ");
                    btn.disabled = true;
                    if (builtSentence.length === q.correct.length) {
                        if (JSON.stringify(builtSentence) === JSON.stringify(q.correct)) {
                            checkAnswer(true);
                        } else {
                            handleWrongAttempt(q.correct.join(" "));
                        }
                    }
                };
                wordsDiv.appendChild(btn);
            });
            gameArea.appendChild(wordsDiv);
        }
        else if (currentMode === 'dictation') {
            createAudioControls(gameArea, q.ar);
            renderSubText(gameArea, "Dinlediğiniz cümleyi yazın:");

            const input = document.createElement("input");
            input.type = "text";
            input.className = "dictation-input";
            gameArea.appendChild(input);

            renderVirtualKeyboard(gameArea, input);

            const submitBtn = document.createElement("button");
            submitBtn.className = "action-btn";
            submitBtn.style.marginTop = "15px";
            submitBtn.innerText = "Kontrol Et";
            submitBtn.onclick = () => {
                if (input.value.trim() === q.ar) {
                    checkAnswer(true);
                } else {
                    handleWrongAttempt(q.ar);
                }
            };
            gameArea.appendChild(submitBtn);
        }
        else if (currentMode === 'story') {
            createAudioControls(gameArea, q.text);

            const hint = document.createElement("div");
            hint.className = "story-hint-text";
            hint.innerText = "💡 İpucu: Kelimelerin Türkçe anlamını görmek için üzerlerine tıklayın.";
            gameArea.appendChild(hint);

            const storyBox = document.createElement("div");
            storyBox.className = "story-container";

            // Başlığın Tıklanabilir Kelimeler Haline Getirilmesi
            const titleDiv = document.createElement("div");
            titleDiv.className = "story-title";
            renderClickableText(titleDiv, q.title, q.dictionary);
            storyBox.appendChild(titleDiv);

            // Metnin Tıklanabilir Kelimeler Haline Getirilmesi
            const textDiv = document.createElement("div");
            textDiv.className = "arabic-text";
            renderClickableText(textDiv, q.text, q.dictionary);
            storyBox.appendChild(textDiv);

            // Boş bir yere tıklandığında açık popupları kapatma
            document.addEventListener('click', () => {
                document.querySelectorAll(".clickable-word").forEach(w => w.classList.remove("active-word"));
            });

            const trans = document.createElement("div");
            trans.className = "story-translation";
            trans.innerText = `Türkçe Tam Çeviri: ${q.tr}`;
            storyBox.appendChild(trans);

            gameArea.appendChild(storyBox);

            const qBox = document.createElement("div");
            qBox.className = "question-box";

            const qTitle = document.createElement("div");
            qTitle.className = "question-title";
            qTitle.innerText = q.question;
            qBox.appendChild(qTitle);

            renderOptions(qBox, q.options, q.correct);
            gameArea.appendChild(qBox);
        }
    }

    // Metni/Başlığı kelimelerine ayırıp her kelimeyi tıklanabilir yapan yardımcı fonksiyon
    function renderClickableText(container, rawText, dictionary) {
        const words = rawText.split(" ");
        words.forEach(rawWord => {
            const cleanWord = rawWord.replace(/[.,،؟!?]/g, "");
            const meaning = (dictionary && dictionary[cleanWord]) 
                ? dictionary[cleanWord] 
                : ((dictionary && dictionary[rawWord]) ? dictionary[rawWord] : "Anlamı mevcut değil");

            const wordSpan = document.createElement("span");
            wordSpan.className = "clickable-word";
            wordSpan.innerText = rawWord + " ";

            const popup = document.createElement("span");
            popup.className = "word-popup";
            popup.innerText = meaning;
            wordSpan.appendChild(popup);

            wordSpan.onclick = (e) => {
                e.stopPropagation();
                const isActive = wordSpan.classList.contains("active-word");
                document.querySelectorAll(".clickable-word").forEach(w => w.classList.remove("active-word"));
                if (!isActive) {
                    wordSpan.classList.add("active-word");
                }
            };

            container.appendChild(wordSpan);
        });
    }

    function handleWrongAttempt(correctAnswer) {
        wrongAttempts++;
        if (wrongAttempts >= 3) {
            alert(`3 defa hatalı deneme yaptınız!\n\nDoğru Cevap: ${correctAnswer}`);
            nextQuestion();
        } else {
            alert(`Hatalı cevap! Kalan hakkınız: ${3 - wrongAttempts}`);
            if (currentMode === 'sentence' || currentMode === 'completion' || currentMode === 'story') {
                loadQuestionStateOnly();
            }
        }
    }

    function createAudioControls(parent, text) {
        const container = document.createElement("div");
        container.className = "audio-controls";

        const normalBtn = document.createElement("button");
        normalBtn.className = "audio-btn";
        normalBtn.innerText = "🔊 Normal Oku";
        normalBtn.onclick = () => speakArabic(text, 1.0);

        const slowBtn = document.createElement("button");
        slowBtn.className = "audio-btn slow";
        slowBtn.innerText = "🐢 Yavaş Oku";
        slowBtn.onclick = () => speakArabic(text, 0.5);

        container.appendChild(normalBtn);
        container.appendChild(slowBtn);
        parent.appendChild(container);
    }

    function speakArabic(text, rate = 1.0) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = rate;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Tarayıcınız sesli okumayı desteklemiyor.");
        }
    }

    function renderVirtualKeyboard(parent, inputTarget) {
        const keyboardContainer = document.createElement("div");
        keyboardContainer.className = "virtual-keyboard";

        arabicKeyboardLayout.forEach(row => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "keyboard-row";

            row.forEach(char => {
                const btn = document.createElement("button");
                btn.className = "key-btn";
                btn.innerText = char;
                btn.onclick = () => {
                    inputTarget.value += char;
                    inputTarget.focus();
                };
                rowDiv.appendChild(btn);
            });

            keyboardContainer.appendChild(rowDiv);
        });

        const controlRow = document.createElement("div");
        controlRow.className = "keyboard-row";

        const backspaceBtn = document.createElement("button");
        backspaceBtn.className = "key-btn wide";
        backspaceBtn.innerText = "Sil ⌫";
        backspaceBtn.onclick = () => {
            inputTarget.value = inputTarget.value.slice(0, -1);
            inputTarget.focus();
        };

        const spaceBtn = document.createElement("button");
        spaceBtn.className = "key-btn wide";
        spaceBtn.style.flex = "1";
        spaceBtn.innerText = "Boşluk";
        spaceBtn.onclick = () => {
            inputTarget.value += " ";
            inputTarget.focus();
        };

        controlRow.appendChild(backspaceBtn);
        controlRow.appendChild(spaceBtn);
        keyboardContainer.appendChild(controlRow);

        parent.appendChild(keyboardContainer);
    }

    function selectMatchCard(card, side, item) {
        if (card.classList.contains('matched')) return;

        if (side === 'left') {
            if (selectedLeftCard) selectedLeftCard.card.classList.remove('selected');
            selectedLeftCard = { card, item };
            card.classList.add('selected');
        } else {
            if (selectedRightCard) selectedRightCard.card.classList.remove('selected');
            selectedRightCard = { card, item };
            card.classList.add('selected');
        }

        if (selectedLeftCard && selectedRightCard) {
            if (selectedLeftCard.item.left === selectedRightCard.item.left) {
                selectedLeftCard.card.classList.add('matched');
                selectedRightCard.card.classList.add('matched');
                selectedLeftCard = null;
                selectedRightCard = null;
                matchedCount++;

                if (matchedCount === 4) {
                    checkAnswer(true);
                }
            } else {
                setTimeout(() => {
                    if (selectedLeftCard) selectedLeftCard.card.classList.remove('selected');
                    if (selectedRightCard) selectedRightCard.card.classList.remove('selected');
                    selectedLeftCard = null;
                    selectedRightCard = null;
                }, 500);
            }
        }
    }

    function renderArabicText(parent, text) {
        const div = document.createElement("div");
        div.className = "arabic-text";
        div.innerText = text;
        parent.appendChild(div);
    }

    function renderSubText(parent, text) {
        const p = document.createElement("p");
        p.innerText = text;
        parent.appendChild(p);
    }

    function renderOptions(parent, options, correct) {
        const grid = document.createElement("div");
        grid.className = "options-grid";
        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                if (opt === correct) {
                    checkAnswer(true);
                } else {
                    handleWrongAttempt(correct);
                }
            };
            grid.appendChild(btn);
        });
        parent.appendChild(grid);
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            score += 10;
            document.getElementById("scoreDisplay").innerText = `Puan: ${score}`;
            alert("Tebrikler!");
            nextQuestion();
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex >= 30) {
            onLevelComplete();
        } else {
            loadQuestion();
        }
    }

    function onLevelComplete() {
        if (currentLevel < maxLevel) {
            alert(`Tebrikler! ${currentLevel}. seviyedeki 30 alıştırmayı tamamladınız. ${currentLevel + 1}. seviyeye geçiliyor!`);
            currentLevel++;
            currentQuestionIndex = 0;
            loadQuestion();
        } else {
            alert("Tüm seviyeleri tamamladınız!");
        }
    }
</script>

</body>
</html>
